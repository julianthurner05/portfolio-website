<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Über – Julian Thurner</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="preload" href="fonts/NeueMontreal-Light.otf" as="font" type="font/otf" crossorigin />
		<link rel="preload" href="fonts/NeueMontreal-Regular.otf" as="font" type="font/otf" crossorigin />
		<link rel="preload" href="fonts/NeueMontreal-Medium.otf" as="font" type="font/otf" crossorigin />
		<link rel="preload" href="fonts/NeueMontreal-Bold.otf" as="font" type="font/otf" crossorigin />
		<link rel="preload" href="fonts/ABCOtto-Light-Trial.otf" as="font" type="font/otf" crossorigin />
		<link rel="preload" href="fonts/ABCOtto-LightItalic-Trial.otf" as="font" type="font/otf" crossorigin />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header class="topbar">
			<span class="wordmark">Julian Thurner</span>
			<nav>
				<a href="/musik">Musik</a>
				<a href="/design">Design</a>
				<a href="/text">Text</a>
			</nav>
			<a href="/about" aria-current="page">Über mich</a>
		</header>
		<div id="cursor" aria-hidden="true"></div>
		<div id="cursor-ring" aria-hidden="true"></div>

		<main>
			<div class="page about">
				<div class="about-grid">
					<figure class="about-photo">
						<img src="media/julian.jpg" alt="Julian Thurner, analoges Schwarz-Weiß-Porträt in einem Wohnzimmer, weißes Hemd, eine Hand in der Hüfte" />
					</figure>
					<div class="about-body">
						<h1>Über mich</h1>
						<p class="intro">
							Platzhaltertext: Hier folgt, wer Julian Thurner ist, woran er
							arbeitet und was ihn interessiert — der Text entsteht gerade.
							Für alles andere: <a href="#kontakt">schreib mir</a>.
						</p>
						<!-- Kein Server dahinter: Absenden öffnet das Mailprogramm -->
						<form class="contact" id="kontakt">
							<label
								>NAME
								<input type="text" name="name" autocomplete="name" required />
							</label>
							<label
								>E-MAIL
								<input type="email" name="email" autocomplete="email" required />
							</label>
							<label
								>NACHRICHT
								<textarea name="message" required></textarea>
							</label>
							<button type="submit" class="pill">Senden</button>
						</form>
					</div>
				</div>
			</div>
		</main>

		<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
		<script src="script.js"></script>
	</body>
</html>
