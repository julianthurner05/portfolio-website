<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Design – Julian Thurner</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header class="topbar">
			<span class="wordmark">Julian Thurner</span>
			<nav>
				<a href="/musik">Musik</a>
				<a href="/design" aria-current="page">Design</a>
				<a href="/text">Text</a>
			</nav>
			<a href="/about">Über mich</a>
		</header>
		<div id="cursor" aria-hidden="true"></div>
		<div id="cursor-ring" aria-hidden="true"></div>

		<main>
			<section class="hero on-blue" id="design">
				<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
					<circle cx="560" cy="430" r="150" fill="var(--yellow)" />
					<rect class="spin" x="740" y="310" width="240" height="240" fill="var(--red)" />
					<path d="M 1060 550 L 1260 550 L 1160 380 Z" fill="var(--paper)" />
					<rect x="300" y="620" width="1000" height="7" fill="var(--paper)" />
				</svg>
				<h1>Design</h1>
				<button class="pill more" aria-expanded="false" aria-controls="design-info">Mehr erfahren</button>
				<div class="infobox" id="design-info">
					<div class="infobox-head">
						<h2>Design</h2>
						<span class="tag">3D</span>
						<span class="tag">Grafik</span>
						<span class="tag">Web</span>
						<button class="close" aria-label="Schließen">×</button>
					</div>
					<p class="intro">
						Platzhaltertext: Hier folgt eine kurze Einführung in die
						Designarbeiten.
					</p>
					<ul class="works-list">
						<li><span class="idx">01</span> Pendulum</li>
						<li><span class="idx">02</span> Mementum</li>
						<li><span class="idx">03</span> Liquid Pattern</li>
						<li><span class="idx">04</span> Das Eventcatering</li>
					</ul>
				</div>
			</section>
		</main>

		<script src="script.js"></script>
	</body>
</html>
