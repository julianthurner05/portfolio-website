<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Kontakt – Julian Thurner</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<a class="wordmark" href="/">Julian Thurner</a>
			<nav>
				<a href="/">Arbeiten</a>
				<a href="/about">Über</a>
				<a href="/kontakt" aria-current="page">Kontakt</a>
			</nav>
		</header>

		<main>
			<div class="page">
				<svg class="accent" viewBox="0 0 100 100" aria-hidden="true">
					<rect x="4" y="40" width="60" height="60" fill="var(--red)" />
					<circle cx="74" cy="28" r="24" fill="var(--yellow)" />
				</svg>
				<h1>Kontakt</h1>
				<!-- Kein Server dahinter: Absenden öffnet das Mailprogramm, fertig adressiert -->
				<form class="contact">
					<label
						>NAME
						<input type="text" name="name" autocomplete="name" required />
					</label>
					<label
						>E-MAIL
						<input type="email" name="email" autocomplete="email" required />
					</label>
					<label
						>NACHRICHT
						<textarea name="message" required></textarea>
					</label>
					<button type="submit">Senden</button>
				</form>
			</div>
		</main>

		<footer>
			<span>© 2026 Julian Thurner</span>
			<a href="mailto:me@julianthurner.com">me@julianthurner.com</a>
		</footer>

		<script>
			// Baut aus den Feldern eine Mail und öffnet das Mailprogramm
			document.querySelector("form.contact").addEventListener("submit", (e) => {
				e.preventDefault();
				const d = new FormData(e.target);
				const subject = encodeURIComponent(`Anfrage von ${d.get("name")}`);
				const body = encodeURIComponent(`${d.get("message")}\n\n${d.get("name")}\n${d.get("email")}`);
				location.href = `mailto:me@julianthurner.com?subject=${subject}&body=${body}`;
			});
		</script>
	</body>
</html>
