<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Kontakt – Julian Thurner</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<button class="menu-btn" aria-label="Menü" aria-expanded="false"></button>
		<nav class="overlay" aria-label="Hauptmenü">
			<a class="pill" href="/">Arbeiten</a>
			<a class="pill" href="/about">Über</a>
			<a class="pill" href="/kontakt" aria-current="page">Kontakt</a>
		</nav>

		<main>
			<div class="page center">
				<!-- Kein Server dahinter: Absenden öffnet das Mailprogramm, fertig adressiert -->
				<form class="contact">
					<label
						>NAME
						<input type="text" name="name" autocomplete="name" required />
					</label>
					<label
						>E-MAIL
						<input type="email" name="email" autocomplete="email" required />
					</label>
					<label
						>NACHRICHT
						<textarea name="message" required></textarea>
					</label>
					<button type="submit" class="pill">Senden</button>
				</form>
			</div>
		</main>

		<script src="script.js"></script>
	</body>
</html>
