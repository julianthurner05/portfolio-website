<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Schreiben – Julian Thurner</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.png" type="image/png" sizes="96x96" />
		<link rel="preload" href="fonts/ABCOtto-Light-Trial.otf" as="font" type="font/otf" crossorigin />
		<link rel="preload" href="fonts/ABCOtto-LightItalic-Trial.otf" as="font" type="font/otf" crossorigin />
		<style>
			@font-face {
				font-family: "ABC Otto";
				src: url("fonts/ABCOtto-Light-Trial.otf") format("opentype");
				font-weight: 300;
				font-display: block;
			}
			@font-face {
				font-family: "ABC Otto";
				src: url("fonts/ABCOtto-LightItalic-Trial.otf") format("opentype");
				font-weight: 300;
				font-style: italic;
				font-display: block;
			}
			:root {
				--paper: #fcfcfc;
				--black: #141414;
				--pad: clamp(1.25rem, 3vw, 2.5rem);
				--ml: clamp(1.25rem, 3vw, 2.5rem);
				--mr: min(94vw, 46rem);
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
			}
			body {
				background: var(--paper);
				color: var(--black);
				font-family: "ABC Otto", Georgia, "Times New Roman", serif;
				font-weight: 300;
				font-variant-numeric: lining-nums;
				font-feature-settings: "lnum" 1, "onum" 0;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			/* Kopf: Textleiste, darunter das Lineal, das die Ränder setzt */
			.top {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				z-index: 10;
				background: linear-gradient(var(--paper) 70%, transparent);
			}
			.bar {
				display: flex;
				align-items: baseline;
				gap: 1.5rem;
				padding: var(--pad) var(--pad) 0.9rem;
			}
			.docs {
				display: flex;
				align-items: baseline;
				gap: 1.4rem;
				min-width: 0;
				overflow-x: auto;
				scrollbar-width: none;
			}
			.docs::-webkit-scrollbar {
				display: none;
			}
			.doc {
				display: inline-flex;
				align-items: baseline;
				gap: 0.35rem;
				white-space: nowrap;
			}
			.bar button {
				border: 0;
				background: none;
				color: inherit;
				font: inherit;
				font-size: 1rem;
				padding: 0;
				cursor: pointer;
				-webkit-text-stroke: 0 var(--black);
				transition: -webkit-text-stroke-width 0.25s ease, opacity 0.25s ease;
			}
			.bar button:hover {
				-webkit-text-stroke-width: 0.45px;
			}
			.doc.active .open {
				font-style: italic;
			}
			.doc .del {
				opacity: 0;
				font-size: 0.85rem;
			}
			.doc:hover .del,
			.doc .del:focus-visible {
				opacity: 0.4;
			}
			.doc .del:hover {
				opacity: 1;
			}
			.new {
				font-size: 1.05rem;
			}

			/* Das Lineal: volle Breite, die schwarze Strecke ist der
			   Schreibbereich; Enden ziehen die Ränder, die Mitte das Ganze */
			.ruler {
				position: relative;
				height: 26px;
				touch-action: none;
			}
			.ruler::before {
				content: "";
				position: absolute;
				left: var(--pad);
				right: var(--pad);
				top: 50%;
				height: 1px;
				translate: 0 -50%;
				background: rgba(20, 20, 20, 0.08);
			}
			.ruler .span {
				position: absolute;
				top: 50%;
				translate: 0 -50%;
				height: 1px;
				background: rgba(20, 20, 20, 0.55);
				left: var(--ml);
				width: calc(var(--mr) - var(--ml));
			}
			.ruler .span::before,
			.ruler .span::after {
				content: "";
				position: absolute;
				top: 50%;
				translate: 0 -50%;
				width: 1px;
				height: 7px;
				background: rgba(20, 20, 20, 0.55);
			}
			.ruler .span::before {
				left: 0;
			}
			.ruler .span::after {
				right: 0;
			}

			/* Das Blatt: Otto wie auf den Textseiten, bündig am linken Rand */
			main {
				padding: calc(var(--pad) + 8rem) 0 50svh;
			}
			.sheet {
				margin-left: var(--ml);
				width: calc(var(--mr) - var(--ml));
				font-family: "ABC Otto", Georgia, "Times New Roman", serif;
				font-weight: 300;
				font-size: clamp(1.25rem, 2.3vw, 2rem);
				line-height: 1.3;
				letter-spacing: -0.03em;
				font-variant-numeric: lining-nums;
				font-feature-settings: "lnum" 1, "onum" 0;
				caret-color: var(--black);
			}
			.title,
			.body {
				outline: none;
				white-space: pre-wrap;
			}
			.title {
				font-weight: 400;
				margin-bottom: 1.45em;
			}
			.title:empty::before {
				content: "Ohne Titel";
				opacity: 0.25;
			}
			.body {
				min-height: 40svh;
			}
			.body:empty::before {
				content: "…";
				opacity: 0.25;
			}
		</style>
	</head>
	<body>
		<header class="top">
			<div class="bar">
				<nav class="docs" aria-label="Texte"></nav>
				<button class="new" aria-label="Neuer Text" type="button">+</button>
			</div>
			<div class="ruler" aria-label="Ränder des Schreibbereichs">
				<div class="span"></div>
			</div>
		</header>

		<main>
			<article class="sheet">
				<div class="title" contenteditable="plaintext-only"></div>
				<div class="body" contenteditable="plaintext-only"></div>
			</article>
		</main>

		<script>
			// Alles bleibt im Browser: Texte in localStorage, Gelöschtes
			// wandert in einen Papierkorb-Schlüssel statt ganz zu verschwinden
			const LS = "schreib-texte";
			const LA = "schreib-aktiv";
			const LW = "schreib-breite";
			const LT = "schreib-papierkorb";

			let docs = [];
			try {
				docs = JSON.parse(localStorage.getItem(LS) || "[]");
			} catch {}
			if (!Array.isArray(docs) || !docs.length) {
				docs = [{ id: Date.now().toString(36), title: "", body: "" }];
			}
			let active = localStorage.getItem(LA);
			if (!docs.some((d) => d.id === active)) active = docs[0].id;

			const barEl = document.querySelector(".docs");
			const titleEl = document.querySelector(".title");
			const bodyEl = document.querySelector(".body");

			const cur = () => docs.find((d) => d.id === active);
			const labelFor = (d) => d.title.trim() || "Ohne Titel";

			// Chrome legt beim Tippen <div>-Blöcke an; innerText zählt dort
			// Leerzeilen doppelt, textContent verliert sie — darum von Hand:
			const textOf = (el) => {
				let out = "";
				for (const n of el.childNodes) {
					if (n.nodeType === 3) out += n.data;
					else if (n.nodeName === "BR") out += "\n";
					else if (n.nodeType === 1) {
						const inner = textOf(n);
						if (out && !out.endsWith("\n")) out += "\n";
						out += inner;
						if (n.nextSibling && !out.endsWith("\n")) out += "\n";
					}
				}
				return out;
			};

			let saveTimer = 0;
			const persist = () => {
				localStorage.setItem(LS, JSON.stringify(docs));
				localStorage.setItem(LA, active);
			};
			const queueSave = () => {
				clearTimeout(saveTimer);
				saveTimer = setTimeout(persist, 300);
			};
			addEventListener("beforeunload", persist);

			const renderBar = () => {
				barEl.innerHTML = "";
				for (const d of docs) {
					const wrap = document.createElement("span");
					wrap.className = "doc" + (d.id === active ? " active" : "");
					const open = document.createElement("button");
					open.type = "button";
					open.className = "open";
					open.textContent = labelFor(d);
					open.addEventListener("click", () => switchTo(d.id));
					const del = document.createElement("button");
					del.type = "button";
					del.className = "del";
					del.textContent = "×";
					del.setAttribute("aria-label", labelFor(d) + " löschen");
					del.addEventListener("click", () => removeDoc(d.id));
					wrap.append(open, del);
					barEl.append(wrap);
				}
			};

			const load = () => {
				const d = cur();
				titleEl.textContent = d.title;
				bodyEl.textContent = d.body;
				document.title = labelFor(d) + " – Schreiben";
				scrollTo(0, 0);
			};

			const switchTo = (id) => {
				if (id === active) return;
				persist();
				active = id;
				persist();
				renderBar();
				load();
			};

			const removeDoc = (id) => {
				const gone = docs.find((d) => d.id === id);
				let trash = [];
				try {
					trash = JSON.parse(localStorage.getItem(LT) || "[]");
				} catch {}
				trash.push(gone);
				localStorage.setItem(LT, JSON.stringify(trash));
				docs = docs.filter((d) => d.id !== id);
				if (!docs.length) docs = [{ id: Date.now().toString(36), title: "", body: "" }];
				if (active === id) active = docs[0].id;
				persist();
				renderBar();
				load();
			};

			document.querySelector(".new").addEventListener("click", () => {
				persist();
				const d = { id: Date.now().toString(36), title: "", body: "" };
				docs.push(d);
				active = d.id;
				persist();
				renderBar();
				load();
				titleEl.focus();
			});

			titleEl.addEventListener("input", () => {
				cur().title = textOf(titleEl).replace(/\n/g, " ");
				const b = barEl.querySelector(".doc.active .open");
				if (b) b.textContent = labelFor(cur());
				document.title = labelFor(cur()) + " – Schreiben";
				queueSave();
			});
			bodyEl.addEventListener("input", () => {
				cur().body = textOf(bodyEl);
				queueSave();
			});
			titleEl.addEventListener("keydown", (e) => {
				if (e.key === "Enter") {
					e.preventDefault();
					bodyEl.focus();
				}
			});
			// Einfügen immer als reiner Text, auch wo plaintext-only fehlt
			for (const el of [titleEl, bodyEl]) {
				el.addEventListener("paste", (e) => {
					e.preventDefault();
					document.execCommand("insertText", false, e.clipboardData.getData("text/plain"));
				});
			}
			addEventListener("keydown", (e) => {
				if ((e.metaKey || e.ctrlKey) && e.key === "s") {
					e.preventDefault();
					persist();
				}
			});

			// Lineal: Enden ziehen die Ränder, die Mitte verschiebt den
			// Bereich als Ganzes; alles in Pixeln, gemerkt in localStorage
			const ruler = document.querySelector(".ruler");
			const MIN = 160;
			const padPx = () => parseFloat(getComputedStyle(document.querySelector(".bar")).paddingLeft) || 40;
			let ml, mr;
			try {
				({ l: ml, r: mr } = JSON.parse(localStorage.getItem(LW)));
			} catch {}
			if (!(ml >= 0) || !(mr > ml)) {
				ml = padPx();
				mr = ml + 672;
			}
			const clampM = () => {
				const p = padPx();
				ml = Math.max(p, Math.min(ml, innerWidth - p - MIN));
				mr = Math.max(ml + MIN, Math.min(mr, innerWidth - p));
			};
			const applyM = () => {
				clampM();
				document.documentElement.style.setProperty("--ml", ml + "px");
				document.documentElement.style.setProperty("--mr", mr + "px");
				localStorage.setItem(LW, JSON.stringify({ l: ml, r: mr }));
			};
			applyM();
			addEventListener("resize", applyM);

			const GRIFF = 18;
			const zone = (x) =>
				Math.abs(x - ml) <= GRIFF ? "l" : Math.abs(x - mr) <= GRIFF ? "r" : x > ml && x < mr ? "m" : null;
			ruler.addEventListener("pointermove", (e) => {
				if (ziehen) return;
				const z = zone(e.clientX);
				ruler.style.cursor = z === "m" ? "grab" : z ? "ew-resize" : "";
			});
			let ziehen = null;
			ruler.addEventListener("pointerdown", (e) => {
				const z = zone(e.clientX);
				if (!z) return;
				ziehen = { z, x: e.clientX, l: ml, r: mr };
				ruler.setPointerCapture(e.pointerId);
				if (z === "m") ruler.style.cursor = "grabbing";
			});
			ruler.addEventListener("pointermove", (e) => {
				if (!ziehen) return;
				const dx = e.clientX - ziehen.x;
				if (ziehen.z === "l") ml = Math.min(ziehen.l + dx, mr - MIN);
				else if (ziehen.z === "r") mr = Math.max(ziehen.r + dx, ml + MIN);
				else {
					const b = ziehen.r - ziehen.l;
					const p = padPx();
					ml = Math.max(p, Math.min(ziehen.l + dx, innerWidth - p - b));
					mr = ml + b;
				}
				applyM();
			});
			const zuEnde = () => {
				ziehen = null;
				ruler.style.cursor = "";
			};
			ruler.addEventListener("pointerup", zuEnde);
			ruler.addEventListener("pointercancel", zuEnde);

			renderBar();
			load();
		</script>
	</body>
</html>
