<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Julian Thurner – Portfolio</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f5f4f0;
				--fg: #161616;
				--muted: #6b6b6b;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #121212;
					--fg: #f0efea;
					--muted: #9a9a9a;
				}
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: var(--bg);
				color: var(--fg);
				font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
			}
			h1 {
				margin: 0;
				font-size: clamp(2.5rem, 8vw, 6rem);
				font-weight: 600;
				letter-spacing: -0.03em;
				line-height: 1;
			}
			p {
				margin: 1rem 0 0;
				color: var(--muted);
				font-size: 1.125rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Julian Thurner</h1>
			<p>Portfolio – bald hier.</p>
		</main>
	</body>
</html>
