<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Julian Thurner</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<style>
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Light.otf") format("opentype");
				font-weight: 300;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-LightItalic.otf") format("opentype");
				font-weight: 300;
				font-style: italic;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Regular.otf") format("opentype");
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Italic.otf") format("opentype");
				font-weight: 400;
				font-style: italic;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Medium.otf") format("opentype");
				font-weight: 500;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-MediumItalic.otf") format("opentype");
				font-weight: 500;
				font-style: italic;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Bold.otf") format("opentype");
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-BoldItalic.otf") format("opentype");
				font-weight: 700;
				font-style: italic;
				font-display: swap;
			}

			:root {
				--black: #000;
				--white: #fff;
			}
			html {
				height: 100%;
				overflow: hidden;
				overscroll-behavior: none;
				-webkit-text-size-adjust: 100%;
				text-size-adjust: 100%;
			}
			body {
				box-sizing: border-box;
				height: 100%;
				overflow: hidden;
				margin: 0;
				background: var(--white);
				color: var(--black);
				font-family: "Neue Montreal", ui-sans-serif, system-ui, sans-serif;
				font-weight: 400;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				text-rendering: optimizeLegibility;
			}
			/* Die weiße Masse: ein Shader rechnet pro Pixel eine weiche,
			   sich verformende Oberfläche, nur aus Licht und Schatten */
			#mass {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
			}
		</style>
	</head>
	<body>
		<canvas id="mass" aria-hidden="true"></canvas>

		<script>
			const canvas = document.getElementById("mass");
			const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
			const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

			if (gl) {
				const VERT = `
					attribute vec2 a;
					void main() { gl_Position = vec4(a, 0.0, 1.0); }
				`;

				// Höhenfeld aus mehrfach ineinander verschobenem Rauschen (Domain Warping),
				// beleuchtet wie ein Relief: Licht von oben links, Senken werden grau
				const FRAG = `
					precision highp float;
					uniform vec2 u_res;
					uniform float u_time;
					uniform vec2 u_mouse;
					uniform float u_mstr;

					vec2 hash(vec2 p) {
						p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
						return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
					}
					float noise(in vec2 p) {
						vec2 i = floor(p), f = fract(p);
						vec2 u = f * f * (3.0 - 2.0 * f);
						return mix(
							mix(dot(hash(i), f), dot(hash(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
							mix(dot(hash(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)), dot(hash(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x),
							u.y);
					}
					float fbm(vec2 p) {
						float v = 0.0, a = 0.5;
						mat2 r = mat2(0.8, -0.6, 0.6, 0.8);
						for (int i = 0; i < 4; i++) {
							v += a * noise(p);
							p = r * p * 2.03;
							a *= 0.5;
						}
						return v;
					}

					float height(in vec2 p) {
						float t = u_time * 0.05;
						vec2 q = vec2(
							fbm(p + t * vec2(0.10, 0.06)),
							fbm(p + vec2(5.2, 1.3) - t * vec2(0.07, 0.09)));
						vec2 r = vec2(
							fbm(p + 1.7 * q + vec2(1.7, 9.2) + t * vec2(0.12, 0.05)),
							fbm(p + 1.7 * q + vec2(8.3, 2.8) - t * vec2(0.06, 0.11)));
						float h = fbm(p + 1.4 * r);
						h += 0.1 * fbm(p * 2.4 - t * 0.2);
						vec2 dm = p - u_mouse;
						h -= u_mstr * 0.4 * exp(-dot(dm, dm) * 14.0);
						return h;
					}

					void main() {
						float zoom = 1.4;
						vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y * zoom;
						float e = 3.0 * zoom / u_res.y;

						float h0 = height(p);
						float hx = height(p + vec2(e, 0.0));
						float hy = height(p + vec2(0.0, e));
						vec3 n = normalize(vec3((h0 - hx) / e * 0.085, (h0 - hy) / e * 0.085, 1.0));

						vec3 L = normalize(vec3(-0.4, 0.55, 0.75));
						float wrap = clamp(dot(n, L), 0.0, 1.0) * 0.5 + 0.5;
						vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
						float spec = pow(clamp(dot(n, H), 0.0, 1.0), 64.0);

						float col = mix(0.78, 1.0, wrap);
						col += spec * 0.07;
						col *= 1.0 - 0.06 * smoothstep(0.15, -0.55, h0);

						// Dithering gegen Streifen in den hellen Verläufen
						float dith = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
						col += (dith - 0.5) / 255.0 * 2.0;

						gl_FragColor = vec4(vec3(col), 1.0);
					}
				`;

				function compile(type, src) {
					const s = gl.createShader(type);
					gl.shaderSource(s, src);
					gl.compileShader(s);
					if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
						console.error(gl.getShaderInfoLog(s));
					return s;
				}
				const prog = gl.createProgram();
				gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
				gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
				gl.linkProgram(prog);
				gl.useProgram(prog);

				gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
				gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
				const loc = gl.getAttribLocation(prog, "a");
				gl.enableVertexAttribArray(loc);
				gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

				const U = (n) => gl.getUniformLocation(prog, n);
				const uRes = U("u_res"), uTime = U("u_time"), uMouse = U("u_mouse"), uMstr = U("u_mstr");

				// Renderauflösung leicht reduziert: schneller, und die weichen
				// Verläufe vertragen das Hochskalieren problemlos
				const SCALE = 0.6;
				function resize() {
					const dpr = Math.min(devicePixelRatio || 1, 2) * SCALE;
					canvas.width = Math.round(canvas.clientWidth * dpr);
					canvas.height = Math.round(canvas.clientHeight * dpr);
					gl.viewport(0, 0, canvas.width, canvas.height);
				}
				resize();
				addEventListener("resize", resize);

				// Zeiger träge nachführen: die Masse gibt unter ihm weich nach
				const zoom = 1.4;
				let tx = 0, ty = 0, cx = 0, cy = 0, tStr = 0, cStr = 0;
				addEventListener("pointermove", (e) => {
					tx = ((e.clientX - canvas.clientWidth / 2) / canvas.clientHeight) * zoom;
					ty = ((canvas.clientHeight / 2 - e.clientY) / canvas.clientHeight) * zoom;
					tStr = 1;
				});
				document.documentElement.addEventListener("pointerleave", () => (tStr = 0));

				function draw(now) {
					cx += (tx - cx) * 0.045;
					cy += (ty - cy) * 0.045;
					cStr += (tStr - cStr) * 0.03;
					gl.uniform2f(uRes, canvas.width, canvas.height);
					gl.uniform1f(uTime, now / 1000);
					gl.uniform2f(uMouse, cx, cy);
					gl.uniform1f(uMstr, cStr);
					gl.drawArrays(gl.TRIANGLES, 0, 3);
				}

				if (reduceMotion) {
					draw(0);
				} else {
					(function loop(now) {
						draw(now);
						requestAnimationFrame(loop);
					})(0);
				}
			}
		</script>
	</body>
</html>
