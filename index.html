<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Julian Thurner</title>
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header>
			<a class="wordmark" href="/">Julian Thurner</a>
			<nav>
				<a href="/" aria-current="page">Arbeiten</a>
				<a href="/about">Über</a>
				<a href="/kontakt">Kontakt</a>
			</nav>
		</header>

		<main>
			<section class="work" id="pendulum">
				<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
					<circle cx="1150" cy="460" r="240" fill="var(--yellow)" />
					<g class="swing">
						<line x1="800" y1="0" x2="800" y2="430" stroke="var(--black)" stroke-width="5" />
						<circle cx="800" cy="500" r="80" fill="var(--red)" />
					</g>
					<rect x="0" y="688" width="1600" height="7" fill="var(--black)" />
				</svg>
				<div class="meta"><span class="num">01</span><span class="tag">3D-Animation</span></div>
				<h1>Pendulum</h1>
			</section>

			<section class="work on-blue" id="mementum">
				<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
					<circle cx="330" cy="700" r="70" fill="var(--yellow)" />
					<g class="lean">
						<rect x="550" y="430" width="70" height="330" fill="var(--paper)" />
					</g>
					<rect x="760" y="430" width="70" height="330" fill="var(--paper)" />
					<rect x="970" y="430" width="70" height="330" fill="var(--paper)" />
					<rect x="1180" y="430" width="70" height="330" fill="var(--paper)" opacity="0.55" />
					<rect x="0" y="760" width="1600" height="7" fill="var(--paper)" />
				</svg>
				<div class="meta"><span class="num">02</span><span class="tag">3D-Animation</span></div>
				<h1>Mementum</h1>
			</section>

			<section class="work on-black" id="liquid-pattern">
				<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
					<g class="turn">
						<circle cx="800" cy="450" r="330" fill="none" stroke="var(--paper)" stroke-width="3" />
						<circle cx="960" cy="330" r="150" fill="var(--blue)" />
						<circle cx="640" cy="560" r="200" fill="none" stroke="var(--yellow)" stroke-width="5" />
						<circle cx="700" cy="300" r="60" fill="var(--red)" />
						<circle cx="1000" cy="600" r="26" fill="var(--yellow)" />
						<circle cx="520" cy="420" r="8" fill="var(--paper)" />
					</g>
				</svg>
				<div class="meta"><span class="num">03</span><span class="tag">Generative Art</span></div>
				<h1>Liquid Pattern</h1>
			</section>

			<section class="work on-red" id="das-eventcatering">
				<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
					<path d="M 560 620 A 240 240 0 0 1 1040 620 Z" fill="var(--paper)" />
					<g class="floaty">
						<path d="M 800 180 L 905 360 L 695 360 Z" fill="var(--black)" />
					</g>
					<circle cx="1120" cy="330" r="46" fill="var(--yellow)" />
					<rect x="430" y="620" width="740" height="7" fill="var(--black)" />
				</svg>
				<div class="meta">
					<span class="num">04</span><span class="tag">Corporate Design</span><span class="tag">Webdesign</span>
				</div>
				<h1>Das Eventcatering</h1>
			</section>
		</main>

		<footer>
			<span>© 2026 Julian Thurner</span>
			<a href="mailto:me@julianthurner.com">me@julianthurner.com</a>
		</footer>
	</body>
</html>
