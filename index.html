<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Julian Thurner – Portfolio</title>
		<style>
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Light.otf") format("opentype");
				font-weight: 300;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-LightItalic.otf") format("opentype");
				font-weight: 300;
				font-style: italic;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Regular.otf") format("opentype");
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Italic.otf") format("opentype");
				font-weight: 400;
				font-style: italic;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Medium.otf") format("opentype");
				font-weight: 500;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-MediumItalic.otf") format("opentype");
				font-weight: 500;
				font-style: italic;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-Bold.otf") format("opentype");
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Neue Montreal";
				src: url("fonts/NeueMontreal-BoldItalic.otf") format("opentype");
				font-weight: 700;
				font-style: italic;
				font-display: swap;
			}

			:root {
				--black: #000;
				--white: #fff;
			}
			html {
				height: 100%;
				overflow: hidden;
				overscroll-behavior: none;
				-webkit-text-size-adjust: 100%;
				text-size-adjust: 100%;
			}
			body {
				box-sizing: border-box;
				height: 100%;
				overflow: hidden;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: var(--white);
				color: var(--black);
				font-family: "Neue Montreal", ui-sans-serif, system-ui, sans-serif;
				font-weight: 400;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				text-rendering: optimizeLegibility;
			}
			p {
				margin: 0;
				font-size: 0.875rem;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<main>
			<p>Hier entsteht etwas Neues.</p>
		</main>
	</body>
</html>
